          - Ship a firearm to another dealer: guide/orders/ship-to-dealer.md
          - Ship accessories to a customer: guide/orders/ship-to-customer.md
          - Deposits and special orders: guide/orders/special-orders.md
          - Change or cancel an order: guide/orders/change-an-order.md
          - Pending Orders: guide/orders/pending-orders.md
          - Ship or hand over an order: guide/orders/ship-or-hand-over.md
          - Web orders: guide/orders/web-orders.md
          - GunBroker orders: guide/orders/gunbroker-orders.md
      - Stock:
          - guide/stock/index.md
          - Receive goods: guide/stock/receive-goods.md
          - Receive a distributor delivery: guide/stock/receive-distributor.md
          - Buy from a private seller: guide/stock/private-seller.md
          - Order from a distributor: guide/stock/distributor-orders.md
          - Models, serials and prices: guide/stock/items-and-serials.md
          - Find and move stock: guide/stock/find-and-move.md
          - Count the shop: guide/stock/inventory-count.md
          - Photos: guide/stock/photos.md
          - List a gun online: guide/stock/list-online.md
          - Consignment: guide/stock/consignment.md
          - Fix a mistake: guide/stock/corrections.md
      - Compliance:
          - guide/compliance/index.md
          - Form 4473 and NICS: guide/compliance/4473.md
          - Find a 4473: guide/compliance/4473-records.md
          - The bound book: guide/compliance/bound-book.md
          - Verify an FFL: guide/compliance/ffl-verification.md
