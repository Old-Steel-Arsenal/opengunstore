# The OpenGunstore docs, published at https://opengunstore.com/docs/ by the
# Old-Steel-Arsenal/opengunstore.com repo (it builds this file from main).
# Local preview: pip install -r docs/requirements.txt && mkdocs serve
site_name: OpenGunstore Docs
site_url: https://opengunstore.com/docs/
site_description: How to use, run and extend OpenGunstore, the open-source POS for FFL dealers.
repo_url: https://github.com/Old-Steel-Arsenal/opengunstore
repo_name: Old-Steel-Arsenal/opengunstore
edit_uri: edit/develop/docs/
copyright: OpenGunstore is free software under the GPLv3.

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra:
  homepage: https://opengunstore.com/
  generator: false

extra_css:
  - assets/extra.css

hooks:
  - scripts/docs/llms_hook.py

# Repo notes that are not part of the published docs (store runbooks, field notes,
# another service's API) stay in the repo but out of the site.
exclude_docs: |
  /requirements.txt
  /cash-drawer.md
  /consignment-payout.md
  /field-notes.md
  /gunbroker-webhooks.md
  /receiving-scan-first.md
  /rsr-fds-after-sale-sop.md
  /sports-south-dropship.md
  /fastbound/
  /catalog-api/
  /api/README.md

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - glightbox:
      touchNavigation: true
      zoomable: true

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark

nav:
  - Home: index.md
  - User guide:
      - guide/index.md
      - Getting started:
          - guide/getting-started/index.md
          - Models, serials and prices: guide/getting-started/models-and-serials.md
          - The Dashboard: guide/getting-started/dashboard.md
          - Roles and permissions: guide/getting-started/roles.md
      - Selling:
          - guide/selling/index.md
          - Point of Sale: guide/selling/pos.md
          - Selling a firearm: guide/selling/firearm-sale.md
          - Customer transfers: guide/selling/transfers.md
          - Customers: guide/selling/customers.md
          - Memberships: guide/selling/memberships.md
          - Build and ship an order: guide/selling/create-order.md
          - The Pending Order queue: guide/selling/pending-orders.md
          - Taking payment: guide/selling/payments.md
          - The cash drawer: guide/selling/cash-drawer.md
          - Opening and closing the day: guide/selling/day-end.md
      - Inventory:
          - guide/inventory/index.md
          - Receiving goods: guide/inventory/receive-goods.md
          - Trade-ins: guide/inventory/trade-ins.md
          - Selling guns on consignment: guide/inventory/consignment.md
          - Items and serial numbers: guide/inventory/items-and-serials.md
          - Photos: guide/inventory/photos.md
          - Storage locations and the store map: guide/inventory/storage-locations.md
          - Counting the shop: guide/inventory/inventory-count.md
          - Fixing mistakes: guide/inventory/corrections.md
      - Compliance:
          - guide/compliance/index.md
          - The bound book: guide/compliance/bound-book.md
          - Form 4473 and NICS: guide/compliance/4473.md
          - 4473 records: guide/compliance/4473-records.md
          - FastBound: guide/compliance/fastbound.md
          - Verifying an FFL: guide/compliance/ffl-verification.md
          - Daily checks: guide/compliance/daily-checks.md
      - Online channels:
          - guide/channels/index.md
          - WooCommerce store: guide/channels/woocommerce.md
          - GunBroker: guide/channels/gunbroker.md
          - Web orders: guide/channels/web-orders.md
      - Distributors:
          - guide/distributors/index.md
          - Distributors hub: guide/distributors/hub.md
          - Distributor orders: guide/distributors/restock.md
      - Reports:
          - guide/reports/index.md
          - Sales Report: guide/reports/sales-report.md
          - Month-end close: guide/reports/month-end.md
      - Settings:
          - guide/settings/index.md
          - FFL Settings: guide/settings/ffl-settings.md
          - Integrations: guide/settings/integrations.md
      - Reference:
          - Glossary: guide/reference/glossary.md
          - Troubleshooting: guide/reference/troubleshooting.md
          - What runs automatically: guide/reference/background-jobs.md
  - Self-hosting:
      - self-hosting.md
      - Install with an AI agent: deploy-with-ai.md
      - Versions: versions.md
  - Developers:
      - developers/index.md
      - Extensions:
          - extensions/README.md
          - Developer specification: extensions/developer-spec.md
          - Quick start: extensions/quickstart.md
          - Core hooks: extensions/hooks.md
      - The MCP server: ai/mcp.md
      - Working as an AI agent: ai/operating.md
      - Data service: data-service.md
      - Testing: testing.md
      - API reference: api/index.html
