# The OpenGunstore docs, published at https://opengunstore.com/docs/ by the
# Old-Steel-Arsenal/opengunstore.com repo (it builds this file from main).
# Local preview: pip install -r docs/requirements.txt && mkdocs serve
site_name: OpenGunstore Docs
site_url: https://opengunstore.com/docs/
site_description: How to use, run and extend OpenGunstore, the open-source POS for FFL dealers.
repo_url: https://github.com/Old-Steel-Arsenal/opengunstore
repo_name: Old-Steel-Arsenal/opengunstore
edit_uri: edit/develop/docs/
copyright: OpenGunstore is free software under the GPLv3.

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra:
  homepage: https://opengunstore.com/
  generator: false

extra_css:
  - assets/extra.css

hooks:
  - scripts/docs/llms_hook.py

# Repo files that stay out of the site: the RSR after-sale procedure (operator alerts in
# ffl_integrations cite it), the Settings field notes (test_field_descriptions reads them),
# another service's API.
exclude_docs: |
  /requirements.txt
  /field-notes.md
  /rsr-fds-after-sale-sop.md
  /fastbound/
  /catalog-api/
  /api/README.md
  /guide/STYLE.md

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - glightbox:
      touchNavigation: true
      zoomable: true
  # Every guide page that moved keeps its old address (guide/STYLE.md, Cross-links).
  - redirects:
      redirect_maps:
        guide/getting-started/index.md: guide/start/first-day.md
        guide/getting-started/models-and-serials.md: guide/stock/items-and-serials.md
        guide/getting-started/dashboard.md: guide/start/dashboard.md
        guide/getting-started/roles.md: guide/start/roles.md
        guide/selling/index.md: guide/counter/index.md
        guide/selling/pos.md: guide/counter/sell-accessories.md
        guide/selling/firearm-sale.md: guide/counter/sell-a-gun.md
        guide/selling/transfers.md: guide/counter/transfers.md
        guide/selling/customers.md: guide/counter/customers.md
        guide/selling/memberships.md: guide/counter/memberships.md
        guide/selling/create-order.md: guide/orders/build-an-order.md
        guide/selling/pending-orders.md: guide/orders/pending-orders.md
        guide/selling/payments.md: guide/counter/payments.md
        guide/selling/cash-drawer.md: guide/counter/cash-drawer.md
        guide/selling/day-end.md: guide/start/day-at-the-counter.md
        guide/inventory/index.md: guide/stock/index.md
        guide/inventory/receive-goods.md: guide/stock/receive-goods.md
        guide/inventory/trade-ins.md: guide/counter/trade-ins.md
        guide/inventory/consignment.md: guide/stock/consignment.md
        guide/inventory/items-and-serials.md: guide/stock/items-and-serials.md
        guide/inventory/photos.md: guide/stock/photos.md
        guide/inventory/storage-locations.md: guide/stock/find-and-move.md
        guide/inventory/inventory-count.md: guide/stock/inventory-count.md
        guide/inventory/corrections.md: guide/stock/corrections.md
        guide/compliance/fastbound.md: guide/admin/fastbound.md
        guide/channels/index.md: guide/orders/index.md
        guide/channels/woocommerce.md: guide/stock/list-online.md
        guide/channels/gunbroker.md: guide/orders/gunbroker-orders.md
        guide/channels/web-orders.md: guide/orders/web-orders.md
        guide/distributors/index.md: guide/admin/distributors.md
        guide/distributors/hub.md: guide/admin/distributors.md
        guide/distributors/restock.md: guide/stock/distributor-orders.md
        guide/reports/index.md: guide/manager/reports.md
        guide/reports/sales-report.md: guide/manager/sales-report.md
        guide/reports/month-end.md: guide/admin/month-end.md
        guide/settings/index.md: guide/manager/settings.md
        guide/settings/ffl-settings.md: guide/admin/ffl-settings.md
        guide/settings/integrations.md: guide/admin/integrations.md
        guide/reference/glossary.md: guide/help/glossary.md
        guide/reference/troubleshooting.md: guide/help/troubleshooting.md
        guide/reference/background-jobs.md: guide/admin/background-jobs.md

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark

