# The OpenGunstore docs, published at https://opengunstore.com/docs/ by the
# Old-Steel-Arsenal/opengunstore.com repo (it builds this file from main).
# Local preview: pip install -r docs/requirements.txt && mkdocs serve
site_name: OpenGunstore Docs
site_url: https://opengunstore.com/docs/
site_description: How to use, run and extend OpenGunstore, the open-source POS for FFL dealers.
repo_url: https://github.com/Old-Steel-Arsenal/opengunstore
repo_name: Old-Steel-Arsenal/opengunstore
edit_uri: edit/develop/docs/
copyright: OpenGunstore is free software under the GPLv3.

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra:
  homepage: https://opengunstore.com/
  generator: false

extra_css:
  - assets/extra.css

hooks:
  - scripts/docs/llms_hook.py

# Repo notes that are not part of the published docs (store runbooks, field notes,
# another service's API) stay in the repo but out of the site.
exclude_docs: |
  /requirements.txt
  /cash-drawer.md
  /consignment-payout.md
  /field-notes.md
  /gunbroker-webhooks.md
  /receiving-scan-first.md
  /rsr-fds-after-sale-sop.md
  /sports-south-dropship.md
  /fastbound/
  /catalog-api/
  /api/README.md
  /guide/STYLE.md

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - glightbox:
      touchNavigation: true
      zoomable: true

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark

nav:
  - Home: index.md
  - User guide:
      - guide/index.md
      - Start here:
          - Your first day: guide/start/first-day.md
          - A day at the counter: guide/start/day-at-the-counter.md
          - Roles and sign-in: guide/start/roles.md
          - The Dashboard: guide/start/dashboard.md
      - At the counter:
          - guide/counter/index.md
          - Sell a gun: guide/counter/sell-a-gun.md
          - Sell accessories: guide/counter/sell-accessories.md
          - Take payment: guide/counter/payments.md
          - Customers: guide/counter/customers.md
          - Memberships: guide/counter/memberships.md
          - Customer transfers: guide/counter/transfers.md
          - Trade-ins: guide/counter/trade-ins.md
          - Cash drawer: guide/counter/cash-drawer.md
      - Orders and shipping:
