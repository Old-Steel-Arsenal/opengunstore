<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;color:#111111;">
<div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
<tr><td align="center" style="padding:24px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#111111;text-align:left;">
<tr><td style="padding:0 0 20px 0;border-bottom:2px solid #111111;">
{% if brand.logo_url %}<img src="{{ brand.logo_url }}" alt="{{ brand.name }}" style="display:block;max-width:240px;max-height:64px;height:auto;border:0;">{% else %}<span style="font-size:22px;font-weight:bold;color:#111111;">{{ brand.name }}</span>{% endif %}
</td></tr>
<tr><td style="padding:24px 0;">
{% block body %}{% endblock %}
</td></tr>
<tr><td style="padding:20px 0 0 0;border-top:1px solid #111111;font-size:12px;line-height:1.6;color:#444444;">
<p style="margin:0;font-weight:bold;color:#111111;">{{ brand.name }}</p>
<p style="margin:0;">{{ brand.address_line }}</p>
{% if brand.phone %}<p style="margin:0;">{{ brand.phone }}</p>{% endif %}
<p style="margin:12px 0 0 0;"><a href="{{ unsubscribe_url }}" style="color:#111111;text-decoration:underline;">Unsubscribe</a></p>
</td></tr>
</table>
</td></tr>
</table>
{% if open_pixel_url %}<img src="{{ open_pixel_url }}" width="1" height="1" alt="" style="display:block;width:1px;height:1px;border:0;">{% endif %}
</body>
</html>
